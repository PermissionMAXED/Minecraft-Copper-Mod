name: Gooby iOS

on:
  push:
    paths:
      - "Gooby/**"
      - ".github/workflows/gooby-ios.yml"
  pull_request:
    paths:
      - "Gooby/**"
      - ".github/workflows/gooby-ios.yml"
  workflow_dispatch:

concurrency:
  group: gooby-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: Gooby
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project Gooby.xcodeproj

      - name: Build (Release, iphoneos, unsigned)
        working-directory: Gooby
        run: |
          set -o pipefail
          xcodebuild \
            -project Gooby.xcodeproj \
            -scheme Gooby \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        working-directory: Gooby
        run: |
          APP_PATH=$(find DerivedData/Build/Products -type d -name "*.app" -path "*Release-iphoneos*" -print -quit)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find DerivedData -type d -name "*.app" -print -quit)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under DerivedData"; exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload Gooby.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Gooby.ipa Payload
          ls -lh Gooby.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gooby-unsigned-ipa
          path: Gooby/Gooby.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gooby-build-log
          path: Gooby/build.log
          if-no-files-found: ignore
